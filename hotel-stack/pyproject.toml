[project]
name = "hotelcore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nikhilllmno", email = "nikhil.m@dextr.ai" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.7.0",
    "baml-py>=0.226.3",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "mcp>=2",
    "psycopg[binary,pool]>=3.3.8",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
