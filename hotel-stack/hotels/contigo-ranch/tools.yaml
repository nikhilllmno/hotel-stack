# Tools the guest agents can call. One entry per tool.
#   description  what the model reads; say when to call it and what it returns
#   parameters   JSON Schema for the arguments
#   channels     where the tool is ON: voice, text. Empty list = OFF everywhere.
#   filler       what the voice agent says while the tool runs (voice only)
# Implementations: src/hotelcore/tools/<name>.py, registered in src/hotelcore/tools/registry.py.

get_rooms_info:
  description: >-
    List the hotel's cabins and cottages with how many guests each sleeps and its beds, plus check-in and
    check-out times and today's date at the hotel. Call it when the caller asks what rooms exist or which room fits their group.
  channels: [voice, text]
  filler: ""
  parameters: {type: object, properties: {}, required: []}

check_availability:
  description: >-
    Check which rooms are free for a stay and what each costs. Returns each available room with its
    total price for the whole stay and the nightly average. Call it before quoting any price or booking.
  channels: [voice, text]
  filler: "Let me check what we have for those dates."
  parameters:
    type: object
    properties:
      arrival: {type: string, description: "Check-in date, YYYY-MM-DD"}
      departure: {type: string, description: "Check-out date, YYYY-MM-DD"}
      adults: {type: integer, description: Number of adults}
      children: {type: integer, description: "Number of children, 0 if none"}
    required: [arrival, departure, adults, children]

create_reservation:
  description: >-
    Book a room as a reservation request after the caller has confirmed every detail: room, dates, number of
    adults and children, full name, phone, and the total from check_availability. The hotel team confirms the
    request and arranges payment; never take card details. Use room_id from check_availability.
  channels: [voice, text]
  filler: "Great, I'm putting that reservation in now."
  parameters:
    type: object
    properties:
      room_id: {type: integer, description: room_id from check_availability}
      arrival: {type: string, description: "YYYY-MM-DD"}
      departure: {type: string, description: "YYYY-MM-DD"}
      adults: {type: integer}
      children: {type: integer}
      first_name: {type: string}
      last_name: {type: string}
      phone: {type: string, description: "Guest phone, international format; defaults to the caller's number"}
      email: {type: string, description: "Guest email, if given"}
      pets: {type: integer, description: "Number of dogs, 0 if none. Put cats in notes, e.g. '1 cat'"}
      notes: {type: string, description: "Special requests, e.g. early check-in"}
    required: [room_id, arrival, departure, adults, children, first_name, last_name]

find_reservation:
  description: >-
    Find an existing reservation by the guest's last name or booking number. Returns dates, room, guests,
    total, status and deposit_paid. status confirmed with deposit_paid above 0 means the deposit is paid; status
    request means it is not paid yet. Always call it again for fresh status. May return several matches.
  channels: [voice, text]
  filler: "One moment while I pull up that reservation."
  parameters:
    type: object
    properties:
      query: {type: string, description: Guest last name or booking number}
    required: [query]

search_knowledge_base:
  description: >-
    Read the hotel's knowledge base. Pass 1-3 topic titles from the knowledge base topic list
    (for example "Pet Policy", "Breakfast"). Use it for any question about the property, policies or the area.
  channels: [voice, text]
  filler: ""
  parameters:
    type: object
    properties:
      topics:
        type: array
        items: {type: string}
        description: Topic titles from the knowledge base list
    required: [topics]

take_message:
  description: >-
    Save a message for the hotel team, who will call back. Use it for anything you cannot do yourself:
    special requests, approvals, complaints, group or wedding enquiries, or when the caller asks for a person.
  channels: [voice, text]
  filler: ""
  parameters:
    type: object
    properties:
      guest_name: {type: string}
      phone: {type: string, description: "Callback number, international format, e.g. +18305551234"}
      reason: {type: string, description: "The specific request, with dates or booking number if relevant"}
    required: [guest_name, phone, reason]

modify_reservation:
  description: >-
    Change the dates or number of guests of an existing direct reservation (same room). Call first with
    confirm=false to get the new total, tell the guest, and only after they clearly agree call again with
    the same values and confirm=true. Use booking_id from find_reservation.
  channels: [voice, text]
  filler: "Let me check that change for you."
  parameters:
    type: object
    properties:
      booking_id: {type: integer, description: booking_id from find_reservation}
      confirm: {type: boolean, description: "false = quote only; true = make the change (only after the guest agrees)"}
      arrival: {type: string, description: "New check-in date YYYY-MM-DD; omit to keep"}
      departure: {type: string, description: "New check-out date YYYY-MM-DD; omit to keep"}
      adults: {type: integer, description: "New number of adults; omit to keep"}
      children: {type: integer, description: "New number of children; omit to keep"}
    required: [booking_id, confirm]

send_text:
  description: >-
    Text the guest one of the hotel's pre-written messages. You choose the template and the number, never the wording.
    booking_confirmation (after create_reservation; includes the deposit payment link) and payment_link need booking_id.
    Returns sent=false if the text could not be sent.
  channels: [voice, text]
  filler: ""
  parameters:
    type: object
    properties:
      template:
        type: string    # choices + descriptions are filled from sms_templates.yaml (non-internal templates)
      to: {type: string, description: "Guest mobile number in international format; defaults to the caller's / texter's number"}
      booking_id: {type: integer, description: "Booking number, required for booking_confirmation and payment_link"}
    required: [template]

alert_upset_guest:
  description: >-
    Quietly alert the hotel owner that the caller is angry, upset or complaining. Call it at most once per call,
    only after you have their name, phone number and what went wrong. Never tell the guest how the team is
    alerted. If it returns alerted false, call take_message with the same details instead.
  channels: [voice]
  filler: ""
  parameters:
    type: object
    properties:
      guest_name: {type: string}
      phone: {type: string, description: Callback number}
      issue: {type: string, description: "One short sentence on what upset the guest, with cabin or booking number if known"}
    required: [guest_name, phone, issue]
