[project]
name = "chrome-bridge"
version = "0.1.0"
description = "MCP server that lets Hermes drive the owner's Chrome through the Hermes for Chrome extension."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2",
    "websockets>=15",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
