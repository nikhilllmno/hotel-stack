model:
  provider: openrouter
  default: anthropic/claude-opus-5.5
  api_mode: chat_completions
terminal:
  backend: docker
  docker_volumes:
    - /Users/nikhil/hermes/hotel-stack:/repo:ro
    - /Users/nikhil/hermes/hotels/demo-hotel/mounts/empty-env:/repo/.env:ro
    - /Users/nikhil/hermes/hotels/demo-hotel/uploads:/uploads
plugins:
  enabled:
    - hotel-trace
    - langfuse
  disabled: []
_left_core_installed:
  - langfuse
_config_version: 53
mcp_servers:
  beds24:
    command: /Users/nikhil/.local/bin/uv
    args:
      - run
      - --directory
      - /Users/nikhil/hermes/beds24-mcp
      - python
      - -m
      - beds24_mcp.server
    enabled: true
    trust: untrusted
  hotel:
    command: /Users/nikhil/.local/bin/uv
    args:
      - run
      - --directory
      - /Users/nikhil/hermes/hotel-stack
      - python
      - -m
      - hotelcore.doss_mcp
    enabled: true
    trust: untrusted
  trivago:
    url: https://mcp.trivago.com/mcp
    enabled: true
    trust: untrusted
  composio:
    url: ${COMPOSIO_MCP_URL}
    headers:
      x-api-key: ${COMPOSIO_MCP_H_X_API_KEY}
    enabled: true
    trust: untrusted   # Composio's hints: reads run, writes (send, create, update) ask the owner in the chat
  chrome:   # the owner's own Chrome via the Hermes for Chrome extension (chrome-extension/README.md)
    command: /Users/nikhil/.local/bin/uv
    args:
      - run
      - --directory
      - /Users/nikhil/hermes/chrome-extension/bridge
      - python
      - -m
      - chrome_bridge.server
    env:
      CHROME_BRIDGE_TOKEN: ${CHROME_BRIDGE_TOKEN}
    enabled: true
    trust: untrusted   # web pages are untrusted input; act_with_approval asks the owner in the chat
