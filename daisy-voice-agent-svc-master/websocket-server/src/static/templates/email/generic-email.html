<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{heading}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:40px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="background-color:{{headerColor}};padding:30px;text-align:center;">
              <h1 style="color:#ffffff;margin:0;font-size:28px;">{{heading}}</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:30px;">
              <p style="font-size:16px;color:#333333;line-height:1.6;">{{greeting}}</p>
              <p style="font-size:16px;color:#333333;line-height:1.6;">{{bodyText}}</p>
              <table role="presentation" width="100%" cellpadding="8" cellspacing="0" style="margin:20px 0;border:1px solid #e0e0e0;border-radius:4px;">
                {{detailRows}}
              </table>
              <p style="font-size:16px;color:#333333;line-height:1.6;">{{closingText}}</p>
              <p style="font-size:16px;color:#333333;line-height:1.6;margin-top:30px;">
                {{signoff}}<br /><strong>{{signoffName}}</strong>
              </p>
            </td>
          </tr>
          <tr>
            <td style="background-color:#ecf0f1;padding:20px;text-align:center;font-size:12px;color:#999999;">
              {{footerText}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
