services:
  websocket-server:
    image: node-twilio-websocket-server
    build:
      context: ./websocket-server
      target: production
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - websocket-server/.env
    depends_on:
      - db
    networks:
      - daisy-network

  db:
    image: postgres:17
    env_file:
      - docker.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - daisy-network

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    env_file:
      - docker.env
    networks:
      - daisy-network

  migrations:
    build:
      context: ./websocket-server
      target: production
      dockerfile: Dockerfile
    command: npm run migrate
    env_file:
      - websocket-server/.env
    networks:
      - daisy-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  daisy-network:
    driver: bridge