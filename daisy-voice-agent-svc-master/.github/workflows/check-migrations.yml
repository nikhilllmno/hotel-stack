name: Migration Number Check

on:
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read

jobs:
  check-migration-numbers:
    name: Check for duplicate migration numbers
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for duplicate migration prefixes
        working-directory: websocket-server
        run: node scripts/check-migration-numbers.js
