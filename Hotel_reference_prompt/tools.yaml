# Every tool Contigo's agents can use, fully defined here. This is the only tools file.
# description + parameters (JSON Schema) are given to the LLM as written.
# channels: where the tool is ON. An empty list means OFF.
# requires_pms: PMS capabilities the tool needs (../../pms/<provider>/capabilities.yaml), checked by `hotelkit check`.
# Implementations: backend (/hotels/{id}/tools/<name>), except search_knowledge_base and send_sms_link (agent-runtime).

get_rooms_info:
  description: Room types with capacity and base nightly rate, plus check-in/out times and today's date at the PMS.
  channels: [voice, text]
  requires_pms: [rooms_info]
  parameters: {type: object, properties: {}}

check_availability:
  description: Available rooms with full price quote (nightly rate, nights, taxes, total) for a stay.
  channels: [voice, text]
  requires_pms: [availability]
  parameters:
    type: object
    properties:
      arrival: {type: string, description: "Check-in date, YYYY-MM-DD"}
      departure: {type: string, description: "Check-out date, YYYY-MM-DD"}
      adults: {type: integer, description: Number of adults}
      children: {type: integer, description: Number of children}
    required: [arrival, departure, adults, children]

create_reservation:
  description: Create a reservation for a room returned by check_availability. Only call after the guest confirms all details.
  channels: [voice, text]
  requires_pms: [create_reservation]
  parameters:
    type: object
    properties:
      room_id: {type: string, description: room_id from check_availability}
      arrival: {type: string, description: "YYYY-MM-DD"}
      departure: {type: string, description: "YYYY-MM-DD"}
      adults: {type: integer}
      children: {type: integer}
      first_name: {type: string}
      last_name: {type: string}
      phone: {type: string, description: Guest phone number}
      email: {type: string, description: "Guest email, if given"}
      pets: {type: integer, description: "Number of dogs the guest is bringing, 0 if none"}
      notes: {type: string, description: Special requests}
    required: [room_id, arrival, departure, adults, children, first_name, last_name, phone]

find_reservation:
  description: Search reservations by confirmation number or guest last name. May return several matches.
  channels: [voice, text]
  requires_pms: [find_by_confirmation, find_by_name]
  parameters:
    type: object
    properties:
      query: {type: string, description: Confirmation number or guest last name}
    required: [query]

modify_reservation:
  description: Change dates, party size, or room of an existing reservation. Only call after the guest confirms the new details and total.
  channels: [voice, text]
  requires_pms: [modify_reservation]
  parameters:
    type: object
    properties:
      reservation_id: {type: string, description: reservation_id from find_reservation}
      arrival: {type: string, description: "New check-in date, YYYY-MM-DD"}
      departure: {type: string, description: "New check-out date, YYYY-MM-DD"}
      adults: {type: integer}
      children: {type: integer}
      room_id: {type: string, description: New room_id from check_availability}
    required: [reservation_id]

# OFF on purpose: Contigo policy is that the agent never cancels.
cancel_reservation:
  description: Cancel a confirmed reservation.
  channels: []
  requires_pms: [cancel_reservation]
  parameters:
    type: object
    properties:
      reservation_id: {type: string}
    required: [reservation_id]

take_message:
  description: Save a callback message for the hotel team. Use for escalations, approvals, and anything you cannot do yourself.
  channels: [voice, text]
  parameters:
    type: object
    properties:
      guest_name: {type: string}
      phone: {type: string, description: Callback number}
      reason: {type: string, description: "Specific request, with dates or confirmation number if relevant"}
    required: [guest_name, phone, reason]

alert_upset_guest:
  description: >-
    Quietly alert the hotel owner that the caller is angry, upset or complaining. Call it at most once per call,
    only for an angry, upset or complaining caller, after you have their name, phone number and what went wrong.
    Never tell the guest how the team is alerted; just say you've let the team know. If it returns alerted false, call take_message instead.
  channels: [voice]
  app: upset_guest_alert
  parameters:
    type: object
    properties:
      guest_name: {type: string}
      phone: {type: string, description: Callback number}
      issue: {type: string, description: "One short sentence on what upset the guest, with cabin or confirmation number if known"}
    required: [guest_name, phone, issue]

search_knowledge_base:
  description: Read full knowledge base sections. Pick 1-3 topics from the knowledge base topic list. The runtime restricts topics to the hotel's real titles.
  channels: [voice, text]
  parameters:
    type: object
    properties:
      topics:
        type: array
        items: {type: string}
        description: Topic titles from the knowledge base list, e.g. ["Cancellation Policy"]
    required: [topics]

send_sms_link:
  description: Text the guest one of the hotel's pre-written messages (e.g. a form link). You choose which message and the number, never the wording.
  channels: [voice]
  parameters:
    type: object
    properties:
      link: {type: string, description: "Name of the pre-written message. The runtime restricts this to the hotel's sms_links."}
      to: {type: string, description: "Guest mobile number in international format, e.g. +918012345678"}
    required: [link, to]
